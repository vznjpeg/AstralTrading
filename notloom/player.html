<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NotLoom — player</title>
    <style>
      * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      body { margin: 0; background: #101016; color: #f1f1f4; }
      header {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 28px; border-bottom: 1px solid #2a2a35;
      }
      header a { color: #b9b9c6; text-decoration: none; font-size: 13px; }
      header a:hover { color: #fff; }
      #name {
        font-size: 16px; font-weight: 600; border: 0; background: transparent;
        color: #f1f1f4; flex: 1; padding: 4px 6px; border-radius: 6px;
      }
      #name:hover, #name:focus { background: #2a2a35; outline: none; }
      main { max-width: 1100px; margin: 0 auto; padding: 24px 28px; }
      video {
        width: 100%; max-height: 70vh; background: #000; border-radius: 12px;
      }
      .row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
      .row .meta { color: #8a8a98; font-size: 13px; flex: 1; }
      button {
        border: 0; border-radius: 8px; cursor: pointer; font-size: 13px;
        background: #2a2a35; color: #f1f1f4; padding: 9px 14px;
      }
      button:hover { background: #3a3a48; }
      button.primary { background: #7c5cff; font-weight: 600; }
      button.primary:hover { background: #8d71ff; }
      button.danger { color: #ff8a8c; }
      .tip { color: #8a8a98; font-size: 12px; margin-top: 18px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <header>
      <a href="library.html">← My videos</a>
      <input id="name" title="Click to rename" />
    </header>
    <main>
      <video id="video" controls autoplay></video>
      <div class="row">
        <span class="meta" id="meta"></span>
        <button class="primary" id="download">Download .webm</button>
        <button id="delete" class="danger">Delete</button>
      </div>
      <p class="tip">
        Your video is stored locally in this browser — nothing was uploaded anywhere.
        To share it, download the file and send it however you like
        (Slack, Drive, email…).
      </p>
    </main>
    <script src="db.js"></script>
    <script src="player.js"></script>
  </body>
</html>
